<!DOCTYPE html>
<html>
<head>
    <title>Privacy Policy Simplifier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2>🔐 Privacy Policy Simplifier</h2>

    <form method="POST" enctype="multipart/form-data">
        <label class="form-label">Upload Privacy Policy (PDF)</label>
        <input type="file" name="pdf" class="form-control mb-2">
        <button type="submit" name="simplify" class="btn btn-primary">Upload and Simplify</button>
    </form>

    <hr>

    <form method="POST">
        <label>Or Paste Raw Text:</label>
        <textarea name="raw_text" class="form-control" rows="8">{{ original_text }}</textarea>
        <button type="submit" name="simplify" class="btn btn-success mt-2">Simplify Text</button>
    </form>

    {% if simplified %}
    <h4 class="mt-4">🧠 Simplified Summary:</h4>
    <textarea class="form-control" rows="6">{{ simplified }}</textarea>
    {% endif %}

    {% if original_text %}
    <form method="POST" class="mt-4">
        <input type="hidden" name="raw_text" value="{{ original_text }}">
        <label>Ask a Question from Policy:</label>
        <input type="text" name="question" class="form-control mb-2" placeholder="e.g. What data is collected?">
        <button type="submit" class="btn btn-warning">Get Answer</button>
    </form>
    {% endif %}

    {% if answer %}
    <div class="alert alert-info mt-3"><strong>Answer:</strong> {{ answer }}</div>
    {% endif %}
</div>
</body>
</html>
